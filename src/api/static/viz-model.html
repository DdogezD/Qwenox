  ["第 1 层：PLE", (() => { const [x, y] = layerOrigin(1); return { t: [x - 190, y - 30, 0], yaw: -0.35, pitch: 0.25, dist: 760 }; })()],
  ["嵌入与第 0–2 层", { t: [0, -150, 0], yaw: -0.5, pitch: 0.25, dist: 1100 }],
  ["输出头与 MTP", { t: [3 * COLW + 160, -PER_COL * LH - 20, 0], yaw: -0.3, pitch: 0.25, dist: 900 }],
];
const nav = document.getElementById("nav");
presets.forEach(([nm, p], i) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = nm;
  b.addEventListener("click", () => { goal = JSON.parse(JSON.stringify(p)); });
  nav.appendChild(b);
});
{ // #v=N opens preset N directly (shareable view)
  const m = /v=(\d+)/.exec(location.hash);
  if (m && presets[+m[1]]) Object.assign(cam, JSON.parse(JSON.stringify(presets[+m[1]][1])));
}

// input
let drag = null;
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); goal = null; });
cv.addEventListener("pointerup", e => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("pointermove", e => {
  mouse = [e.clientX, e.clientY]; mouseDirty = true;
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const f = norm(sub(cam.t, eye())), r = norm(cross(f, [0, 1, 0])), u = cross(r, f);
    const k = cam.dist * 2 * Math.tan(FOV / 2) / H;
    cam.t = add(cam.t, add(mul(r, -dx * k), mul(u, dy * k)));
  } else {
    cam.yaw -= dx * 0.005;
    cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + dy * 0.005));
  }
});
cv.addEventListener("wheel", e => { e.preventDefault(); goal = null; cam.dist = Math.max(20, Math.min(9000, cam.dist * Math.exp(e.deltaY * 0.0012))); }, { passive: false });
let mouse = null, mouseDirty = false;

// picking
function pick(mx, my) {
  const e = eye(), f = norm(sub(cam.t, e)), r = norm(cross(f, [0, 1, 0])), u = cross(r, f);
  const th = Math.tan(FOV / 2), asp = W / H;
  const nx = (mx / W) * 2 - 1, ny = 1 - (my / H) * 2;
  const d = norm(add(f, add(mul(r, nx * th * asp), mul(u, ny * th))));
  let best = null, bt = Infinity;
  for (const b of boxes) {
    if (!b.pick) continue;
    let t0 = -Infinity, t1 = Infinity, ok = true;
    for (let k = 0; k < 3; k++) {
      const lo = b.o[k], hi = b.o[k] + b.s[k];
      if (Math.abs(d[k]) < 1e-9) { if (e[k] < lo || e[k] > hi) { ok = false; break; } continue; }
      let a = (lo - e[k]) / d[k], c = (hi - e[k]) / d[k];
      if (a > c) [a, c] = [c, a];
      t0 = Math.max(t0, a); t1 = Math.min(t1, c);
      if (t0 > t1) { ok = false; break; }
    }
    if (ok && t1 > 0 && t0 < bt) { bt = Math.max(t0, 0); best = b; }
  }
  return best;
}
let hovered = null;
function setHover(b) {
  if (b === hovered) return;
  if (hovered) { hovered.hl = 0; upload(hovered); }
  hovered = b;
  if (b) { b.hl = 1; upload(b); }
  const nm = document.getElementById("i-name"), shp = document.getElementById("i-shape"), ds = document.getElementById("i-desc");
  if (!b) { nm.textContent = "把鼠标移到方块上"; shp.textContent = ""; ds.textContent = "拖动旋转，滚轮缩放，右键拖动平移。点下方按钮跳到某一部分。"; return; }
  nm.textContent = b.name; shp.textContent = b.shape;
  let extra = "";
  if (b.kind === "expert" && b.w > 0) extra = `当前 token 选中了它，权重 ${(b.w * 100).toFixed(0)}%。`;
  else if (b.kind === "expert") extra = "当前 token 没有选它。";
  ds.textContent = (extra ? extra + "\n" : "") + b.desc;
}

// ---------------- labels ----------------
const lbRoot = document.getElementById("labels");
for (const lb of labels) { lb.el = document.createElement("div"); lb.el.className = "lb " + lb.cls; lb.el.textContent = lb.text; lbRoot.appendChild(lb.el); }
function placeLabels() {
  const e = eye();
  for (const lb of labels) {
    const p = lb.p, dist = Math.hypot(...sub(p, e));
    const c = [0, 1, 2, 3].map(i => VP[i] * p[0] + VP[4 + i] * p[1] + VP[8 + i] * p[2] + VP[12 + i]);
    if (c[3] <= 0 || dist > lb.far || dist < lb.near) { lb.el.style.display = "none"; continue; }
    const sx = (c[0] / c[3] * 0.5 + 0.5) * W, sy = (1 - (c[1] / c[3] * 0.5 + 0.5)) * H;
    if (sx < -100 || sx > W + 100 || sy < -40 || sy > H + 40) { lb.el.style.display = "none"; continue; }
    lb.el.style.display = "block";
    lb.el.style.left = sx + "px"; lb.el.style.top = sy + "px";
  }
}

// ---------------- recorded routing ----------------
let tokIdx = 0, playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
const playBtn = document.getElementById("play");
playBtn.setAttribute("aria-pressed", String(playing)); playBtn.textContent = playing ? "暂停" : "播放";
playBtn.addEventListener("click", () => { playing = !playing; playBtn.setAttribute("aria-pressed", String(playing)); playBtn.textContent = playing ? "暂停" : "播放"; });
function showToken(i) {
  tokIdx = (i + ROUTES.length) % ROUTES.length;
  const r = ROUTES[tokIdx];
  for (let l = 0; l < L; l++) {
    const base = expertBase[l];
    for (let e = 0; e < E; e++) { const b = boxes[base + e]; if (b.w) { b.w = 0; b.s[1] = 2; b.o[1] = b.top - 2; b.c = C.off; } }
    for (let j = 0; j < K; j++) {
      const id = r.e[l * K + j]; if (id < 0) continue;
      const b = boxes[base + id], w = r.w[l * K + j] / 255;
      b.w = w; const h = 3 + 22 * Math.sqrt(w); b.s[1] = h; b.o[1] = b.top - 2; b.c = C.on;
    }
  }
  // re-upload expert range (contiguous per layer in the opaque set)
  for (let l = 0; l < L; l++) for (let e = 0; e < E; e++) { const b = boxes[expertBase[l] + e]; writeInst(opaque.data, b.slot, b); }
  gl.bindBuffer(gl.ARRAY_BUFFER, opaque.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, opaque.data);
  const line = ROUTES.map((t, k) => k === tokIdx ? `<b>${esc(t.t)}</b>` : esc(t.t)).join("");
  document.getElementById("tokline").innerHTML = line;
  document.getElementById("tokinfo").textContent = `第 ${tokIdx + 1} / ${ROUTES.length} 个 token`;
  if (hovered && hovered.kind === "expert") { const h = hovered; hovered = null; setHover(h); }
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])).replace(/\n/g, "↵"); }
for (let l = 0; l < L; l++) for (let e = 0; e < E; e++) { const b = boxes[expertBase[l] + e]; b.top = b.o[1] + b.s[1]; b.w = 0; }
document.getElementById("tokline").addEventListener("click", () => {});
showToken(0);
let lastTok = 0;

// ---------------- frame ----------------
function frame(t) {
  requestAnimationFrame(frame);
  if (goal) {
    const k = 0.12;
    cam.t = add(cam.t, mul(sub(goal.t, cam.t), k));
    let dy = goal.yaw - cam.yaw; cam.yaw += dy * k;
    cam.pitch += (goal.pitch - cam.pitch) * k;
    cam.dist *= Math.exp(Math.log(goal.dist / cam.dist) * k);
    if (Math.abs(Math.log(goal.dist / cam.dist)) < 0.002 && Math.hypot(...sub(goal.t, cam.t)) < 0.5) goal = null;
  }
  if (playing && t - lastTok > 450) { lastTok = t; showToken(tokIdx + 1); }
  const e = eye();
  VP = mm(persp(FOV, W / H, Math.max(1, cam.dist * 0.01), cam.dist * 8 + 6000), lookAt(e, cam.t, [0, 1, 0]));
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0.902, 0.894, 0.925, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
  gl.useProgram(prog); gl.uniformMatrix4fv(uVP, false, VP);
  gl.disable(gl.BLEND); gl.depthMask(true);
  gl.bindVertexArray(opaque.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, opaque.n);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  gl.bindVertexArray(transp.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, transp.n);
  gl.depthMask(true);
  placeLabels();
  if (mouse && !drag && mouseDirty) { mouseDirty = false; setHover(pick(mouse[0], mouse[1])); }
}
requestAnimationFrame(frame);
</script>
</body>
